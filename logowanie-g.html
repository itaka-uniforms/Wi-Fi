            <form id="loginForm" class="login-form" novalidate>
                <div class="input-group">
                    <input type="text" id="email" class="input-field" placeholder=" " autocomplete="email">
                    <label for="email" class="input-label">Adres e-mail lub telefonu</label>
                </div>
                
                <div class="forgot-email">
                    <a href="#">Nie pamiętasz adresu?</a>
                </div>
                
                <div class="form-actions">
                    <a href="#" class="create-account"></a>
                    <button type="submit" class="next-button">Dalej</button>
                </div>
            </form>
        </div>
        
        <div class="footer">

                    <option value="de">Deutsch</option>

            <div class="footer-links">
